<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Excel Financial Auditor</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>:root{--ink:#14213d;--muted:#667085;--line:#e6eaf0;--bg:#f5f7fb;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Segoe UI,Arial,sans-serif}.shell{max-width:1180px;margin:auto;padding:36px 22px}.top,.summary,.issue-top{display:flex;justify-content:space-between;gap:18px;align-items:center}h1{font-size:29px;margin:0}.sub,.muted{color:var(--muted)}.badge,.tag{font-size:12px;font-weight:700;color:#1d4ed8;background:#dbeafe;padding:6px 10px;border-radius:20px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 3px 10px #1f293708}.drop{border:2px dashed #91a8d1;text-align:center;padding:42px;background:linear-gradient(135deg,#fff,#f4f8ff)}button{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:11px 17px;font-weight:650;cursor:pointer}button:disabled{opacity:.5}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.n{font-size:29px;font-weight:750}.critical .n{color:#dc2626}.high .n{color:#ea580c}.medium .n{color:#ca8a04}.low .n{color:#0284c7}.risk{font-size:20px;font-weight:750}.toolbar select{padding:8px;margin-right:8px;border:1px solid var(--line);border-radius:7px}.issue{border-left:5px solid #94a3b8}.issue.CRITICAL{border-color:#dc2626}.issue.HIGH{border-color:#ea580c}.issue.MEDIUM{border-color:#ca8a04}.issue.LOW{border-color:#0284c7}.tag{color:#334155;background:#f1f5f9}.formula{background:#f8fafc;border-radius:7px;padding:9px;font-family:Consolas,monospace;overflow:auto}.detail{color:#475467}.empty{padding:20px;color:var(--muted);text-align:center}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.top,.summary{align-items:flex-start;flex-direction:column}}</style></head>
<body><main class="shell"><header class="top"><div><h1>Excel Financial Auditor</h1><div class="sub">Проверка Excel-формул и финансовой логики прямо в браузере</div></div><span class="badge">FILES STAY ON YOUR DEVICE</span></header>
<section class="card drop"><h2>Загрузите финансовую Excel-книгу</h2><p class="muted">Поддерживаются .xlsx и .xlsm. Файл не отправляется на сервер.</p><input id="file" type="file" accept=".xlsx,.xlsm"><p><button id="analyze" disabled>Analyze workbook</button></p><p id="notice" class="muted">Выберите файл, чтобы начать анализ.</p></section>
<div id="results" hidden><section class="card summary"><div><b id="bookName"></b><br><span id="bookMeta" class="muted"></span></div><div><span class="muted">Overall risk</span><div id="risk" class="risk"></div></div></section><section id="stats" class="stats"></section><section class="card"><h2>Листы книги</h2><div id="sheets"></div></section><section class="card"><h2>Найденные проблемы</h2><div class="toolbar"><select id="severity"><option value="">Все уровни</option><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select><select id="sheet"><option value="">Все листы</option></select></div><div id="issueList"></div></section></div></main>
<script>
const $=id=>document.getElementById(id),ERRORS=['#REF!','#DIV/0!','#VALUE!','#NAME?','#N/A','#NUM!','#NULL!'];let wb,fileName,issues=[];
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;fileName=f.name;$('analyze').disabled=true;$('notice').textContent='Читаю файл…';try{wb=XLSX.read(await f.arrayBuffer(),{cellFormula:true,cellStyles:true});$('notice').textContent=`Книга «${f.name}» готова к анализу.`;$('analyze').disabled=false}catch(x){$('notice').textContent='Не удалось прочитать файл: '+x.message}};$('analyze').onclick=startAudit;$('severity').onchange=renderIssues;$('sheet').onchange=renderIssues;
function add(severity,confidence,sheet,cell,title,rule,description,formula='',recommendation=''){issues.push({severity,confidence,sheet,cell,title,rule,description,formula,recommendation})}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function num(v){return typeof v==='number'&&Number.isFinite(v)}
function norm(f,addr){let m=/([A-Z]+)(\d+)/.exec(addr),bc=XLSX.utils.decode_col(m?.[1]||'A'),br=+(m?.[2]||1)-1;return f.toUpperCase().replace(/\$?([A-Z]{1,3})\$?(\d+)/g,(_,c,r)=>`R[${+r-1-br}]C[${XLSX.utils.decode_col(c)-bc}]`).replace(/\s/g,'')}
function startAudit(){try{$('analyze').disabled=true;$('notice').textContent='Выполняю анализ…';audit();$('notice').textContent='Анализ завершён.'}catch(x){console.error(x);$('notice').textContent='Ошибка анализа: '+x.message+' Попробуйте сохранить книгу как .xlsx и повторить.'}finally{$('analyze').disabled=false}}
function audit(){issues=[];let formulas=0,profiles=[];wb.SheetNames.forEach(name=>{let ws=wb.Sheets[name];if(!ws||typeof ws!=='object'){profiles.push({name,rows:0,cols:0,formulas:0,pop:0,unsupported:true});add('INFO','HIGH',name,'','Unsupported sheet type','STRUCT-004','Лист не содержит обычной табличной сетки и был пропущен.','','Откройте его в Excel и при необходимости сохраните как обычный worksheet.');return}let rg=XLSX.utils.decode_range(ws['!ref']||'A1'),pop=0,fc=0;for(let r=rg.s.r;r<=rg.e.r;r++){let row=[];for(let c=rg.s.c;c<=rg.e.c;c++){let addr=XLSX.utils.encode_cell({r,c}),x=ws[addr];row.push({addr,x});if(!x)continue;pop++;if(x.f){fc++;formulas++;let f='='+x.f,u=f.toUpperCase(),err=ERRORS.find(v=>u.includes(v));if(err)add('CRITICAL','HIGH',name,addr,`Formula contains ${err}`,err==='#REF!'?'TECH-002':'TECH-001',`Формула содержит ошибку ${err}.`,f,'Исправьте ссылку или выражение.');if(/\[[^\]]+\]/.test(f))add('MEDIUM','HIGH',name,addr,'External workbook reference','TECH-004','Формула ссылается на другую книгу.',f,'Проверьте доступность внешнего файла.');if(f.includes('/')&&!/IFERROR|IF\s*\(/i.test(f))add('LOW','LOW',name,addr,'Division by zero risk','FORMULA-008','Деление не имеет явной защиты.',f,'Подтвердите, что знаменатель не бывает нулём.')}}for(let c=1;c<row.length-1;c++){let l=row[c-1],m=row[c],rr=row[c+1];if(l.x?.f&&rr.x?.f&&norm('='+l.x.f,l.addr)===norm('='+rr.x.f,rr.addr)){if(m.x&&num(m.x.v))add('HIGH','HIGH',name,m.addr,'Hardcoded value inside formula series','FORMULA-003','Число прерывает одинаковый ряд формул.','',`Ожидаемый шаблон: ${norm('='+l.x.f,l.addr)}`);if(m.x?.f&&norm('='+m.x.f,m.addr)!==norm('='+l.x.f,l.addr))add('HIGH','HIGH',name,m.addr,'Formula differs from neighboring periods','FORMULA-001','Соседние периоды имеют одинаковую структуру, но текущий отличается.','='+m.x.f,`Ожидаемый шаблон: ${norm('='+l.x.f,l.addr)}`)}}}balanceCheck(name,ws,rg);profiles.push({name,rows:rg.e.r+1,cols:rg.e.c+1,formulas:fc,pop})});render(profiles,formulas)}
function balanceCheck(name,ws,rg){let labels={};for(let r=rg.s.r;r<=rg.e.r;r++)for(let c=rg.s.c;c<=Math.min(rg.s.c+4,rg.e.c);c++){let x=ws[XLSX.utils.encode_cell({r,c})];if(x&&typeof x.v==='string')labels[x.v.trim().toLowerCase()]=r}let a=labels['total assets']??labels['assets'],b=labels['total liabilities and equity']??labels['liabilities + equity'];if(a===undefined||b===undefined)return;for(let c=1;c<=rg.e.c;c++){let av=ws[XLSX.utils.encode_cell({r:a,c})]?.v,bv=ws[XLSX.utils.encode_cell({r:b,c})]?.v;if(num(av)&&num(bv)&&Math.abs(av-bv)>.01)add('CRITICAL','HIGH',name,XLSX.utils.encode_cell({r:a,c}),'Balance Sheet does not balance','BS-001','Total Assets не равно Total Liabilities + Equity.','',`Разница: ${av-bv}`)}}
function render(p,formulas){let c={CRITICAL:0,HIGH:0,MEDIUM:0,LOW:0};issues.forEach(i=>c[i.severity]++);let score=c.CRITICAL*10+c.HIGH*5+c.MEDIUM*2+c.LOW,risk=score>=70?'CRITICAL':score>=31?'HIGH':score>=11?'MEDIUM':'LOW';$('bookName').textContent='Workbook: '+fileName;$('bookMeta').textContent=`${p.length} листов · ${formulas.toLocaleString('ru')} формул · ${issues.length} проблем`;$('risk').textContent=`${risk} · ${score}`;$('risk').style.color={CRITICAL:'#dc2626',HIGH:'#ea580c',MEDIUM:'#ca8a04',LOW:'#0284c7'}[risk];$('stats').innerHTML=[['Total issues',issues.length,''],['Critical',c.CRITICAL,'critical'],['High',c.HIGH,'high'],['Medium',c.MEDIUM,'medium'],['Low',c.LOW,'low']].map(x=>`<div class="card ${x[2]}"><span class="muted">${x[0]}</span><div class="n">${x[1]}</div></div>`).join('');$('sheets').innerHTML='<ul>'+p.map(s=>`<li><b>${esc(s.name)}</b> — ${s.rows} rows, ${s.cols} columns, ${s.formulas} formulas</li>`).join('')+'</ul>';$('sheet').innerHTML='<option value="">Все листы</option>'+p.map(s=>`<option>${esc(s.name)}</option>`).join('');$('results').hidden=false;renderIssues();$('results').scrollIntoView({behavior:'smooth'})}
function renderIssues(){let s=$('severity').value,sh=$('sheet').value,v=issues.filter(i=>(!s||i.severity===s)&&(!sh||i.sheet===sh));$('issueList').innerHTML=v.length?v.map(i=>`<article class="card issue ${i.severity}"><div class="issue-top"><span class="tag">${i.severity} · ${i.confidence}</span><b>${esc(i.sheet)}!${i.cell}</b></div><h3>${esc(i.title)}</h3><p class="detail">${esc(i.description)}</p>${i.formula?`<div class="formula">${esc(i.formula)}</div>`:''}<p><b>Rule:</b> ${i.rule}<br><b>Рекомендация:</b> ${esc(i.recommendation)}</p></article>`).join(''):'<p class="empty">Проблем по выбранному фильтру нет.</p>'}
</script></body></html>
